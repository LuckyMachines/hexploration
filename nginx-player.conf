server {
  listen 8080;
  listen [::]:8080;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  include /etc/nginx/snippets/xenovoya-player-security.conf;

  location = /release.json {
    include /etc/nginx/snippets/xenovoya-player-security.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  location /assets/ {
    include /etc/nginx/snippets/xenovoya-player-security.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location /images/ {
    include /etc/nginx/snippets/xenovoya-player-security.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location / {
    include /etc/nginx/snippets/xenovoya-player-security.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }
}
